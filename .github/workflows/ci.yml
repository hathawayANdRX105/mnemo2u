name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # lance-encoding builds protobuf definitions; native-tls needs OpenSSL headers.
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # `--no-fail-fast`: report every failing test binary in one run instead of
      # one per 15-minute CI cycle.
      - name: Test
        run: cargo test --all-targets --no-fail-fast

  # The kuzu backend vendors a C++ engine: its own job so the default pipeline
  # stays fast, and the adapter only compiles/tests with the feature enabled.
  # `CXXFLAGS` comes from the checked-in `.cargo/config.toml` (old thrift needs
  # `<cstdint>`).
  kuzu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev cmake
      - uses: Swatinem/rust-cache@v2
        with:
          key: kuzu
      - name: Clippy
        run: cargo clippy --features kuzu-backend --all-targets -- -D warnings
      - name: Test
        run: cargo test --features kuzu-backend --all-targets --no-fail-fast
