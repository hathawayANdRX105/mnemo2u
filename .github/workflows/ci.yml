name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # lance-encoding builds protobuf definitions; native-tls needs OpenSSL headers.
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # `--no-fail-fast`: report every failing test binary in one run instead of
      # one per 15-minute CI cycle.
      - name: Test
        run: cargo test --all-targets --no-fail-fast
      # Real-backend smoke for the read-path diagnosis (stage doc 07): the
      # probe opens the durable Turso stores and fails the job when either
      # attribution terminal stops holding.
      - name: Smoke (diag probe)
        run: cargo run --quiet --example diag_probe
      # Real-backend smoke for the tuning surface (stage doc 08 S2): two eval
      # cases into a scoreboard, plus the knob set the attribution names for a
      # ranked-out miss. Fails the job when a case stops passing or when a
      # stage's knob set stops being the one the registry states.
      - name: Smoke (tune probe)
        run: cargo run --quiet --example tune_probe
