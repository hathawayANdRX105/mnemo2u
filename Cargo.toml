[package]
name = "mnemo2u"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Memory/RAG library for coding harnesses: graph relations + vector facts + Turso truth, Jev as judge"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"

