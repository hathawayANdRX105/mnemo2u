[workspace]
resolver = "2"
members = [
    "crates/mnemo-core",
    "crates/mnemo-store",
    "crates/mnemo-index",
    "crates/mnemo-query",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
