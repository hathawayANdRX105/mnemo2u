[package]
name = "mnemo2u"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Memory/RAG library for coding harnesses: graph relations + vector facts + Turso truth, Jev as judge"
publish = false

# The root package is the facade: it re-exports `mnemo-core` under the module
# paths the library has always published (`mnemo2u::core::traits::*`,
# `mnemo2u::store::*`, ...), so downstream path dependencies keep resolving.
#
# Being a package *and* the workspace root is deliberate: a path dependency
# (`mnemo2u = { path = "../mnemo2u" }`) cannot point at a virtual manifest,
# and this root package is what keeps that dependency working.
[workspace]
resolver = "2"
members = ["crates/*", "bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"

# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }

# hashing / tokenization / text (parity with the reference implementation)
md-5 = "0.11"
tiktoken-rs = "0.12"
regex = "1"

# http + config + cli + logs
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# graph algorithms (leiden-rs without default features: no CLI, no rayon —
# parallel local moving would cost determinism)
petgraph = "0.8"
leiden-rs = { version = "0.8", default-features = false }

# storage backends
turso = "0.8.3-pre.1"
lancedb = { version = "0.40", features = ["remote"] }
# same wheel as lancedb's lock (arrow 58) so no duplicate arrow builds
arrow-array = "58"
arrow-schema = "58"
futures = "0.3"
# local embeddings (ONNX)
fastembed = "7"
redb = "4.4.0"

[dependencies]
mnemo-core = { path = "crates/mnemo-core" }

[features]
default = []

[dev-dependencies]
tempfile = "3"
