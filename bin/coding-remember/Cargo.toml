[package]
name = "coding-remember-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Write and recall a coding session's memory: episodes, rules and procedures"
publish = false

# The binary is named `coding-remember` (the command a harness types) while the
# package is `coding-remember-cli`: a package and a crate cannot share a name
# inside one workspace, and `coding-memory` is taken by the craft's library.
#
# This is the third entry in `bin/`, and it is the first one that exists for a
# *consumer* rather than for this repo's own tooling. `bin/novel-review` serves
# the review craft's own front end; this one is the seam a coding harness
# (ferrite) drives — it keeps that repo free of any dependency on this one,
# because the harness shells out instead of linking.
[lib]
name = "coding_remember"
path = "src/lib.rs"

[[bin]]
name = "coding-remember"
path = "src/main.rs"

[dependencies]
coding-memory = { path = "../../craft/coding-memory" }
mnemo2u = { path = "../../crates/mnemo2u" }
anyhow = "1"
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
