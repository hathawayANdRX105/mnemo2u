[package]
name = "novel-memory"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The novel craft: scan a novel directory into narrative fact slots"
publish = false

[dependencies]
mnemo2u = { path = "../../crates/mnemo2u" }
# The narrative kernel: story-time coordinates and slot hashing. The tavern
# craft sits on the same kernel, so it is its own crate rather than part of
# this one.
narrative-core = { path = "../narrative-core" }
anyhow = "1"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
