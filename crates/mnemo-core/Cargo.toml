[package]
name = "mnemo-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Core implementation of the mnemo2u memory/RAG library"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

# async runtime
tokio = { workspace = true }

# hashing / tokenization / text (parity with the reference implementation)
md-5 = { workspace = true }
tiktoken-rs = { workspace = true }
regex = { workspace = true }

# http + config + cli + logs
reqwest = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

# graph algorithms (leiden-rs without default features: no CLI, no rayon —
# parallel local moving would cost determinism)
petgraph = { workspace = true }
leiden-rs = { workspace = true }

# storage backends
turso = { workspace = true }
lancedb = { workspace = true }
# same wheel as lancedb's lock (arrow 58) so no duplicate arrow builds
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
futures = { workspace = true }
# local embeddings (ONNX)
fastembed = { workspace = true }
redb = { workspace = true }

[features]
default = []

[dev-dependencies]
tempfile = "3"

# The integration tests and examples in this package exercise the library
# through its published facade (`mnemo2u::core::traits::*` and friends), not
# through `mnemo_core::` — that is the contract every downstream consumer
# depends on, so the contract is what the tests must pin. The dev-dependency
# closes a cycle (facade -> core -> facade), which Cargo allows because the
# back edge is a dev-dependency only.
mnemo2u = { path = "../mnemo2u" }
